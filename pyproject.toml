[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moesif-litellm"
version = "0.1.0"
description = "Moesif observability plugin for LiteLLM"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = [
    "litellm>=1.0.0",
    "httpx>=0.24.0",
]

[project.optional-dependencies]
sdk = ["moesifapi>=1.1.0"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "respx>=0.20",
    "pytest-cov",
]

[project.urls]
Homepage = "https://www.moesif.com"
Repository = "https://github.com/Moesif/moesif-litellm"

[tool.setuptools.packages.find]
include = ["moesif_litellm*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/unit"]
